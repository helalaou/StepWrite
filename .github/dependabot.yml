# Dependabot opens pull requests that update dependencies, once a week, and
# the Builds workflow builds and tests each one before it is merged. Minor and
# patch updates in a folder come together in one pull request. Major updates
# come one at a time, since they may need code changes. See
# docs/app-builds.md#dependency-updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # concurrently, which runs the server and the client together
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    groups:
      server:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(server)

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      client:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(client)

  # A new major version of Capacitor also changes the native projects, which
  # `npx cap migrate` does, so only minor and patch updates come from here.
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    groups:
      mobile:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '@capacitor/*'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore(mobile)

  # The Android project's versions come from Capacitor's template, so they
  # move with Capacitor's major versions, as above.
  - package-ecosystem: gradle
    directory: /mobile/android
    schedule:
      interval: weekly
    groups:
      android:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore(mobile)
