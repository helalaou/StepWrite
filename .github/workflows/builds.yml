# Tests and builds the StepWrite server and every app on each push to main,
# each version tag (v1.2.0, for example) and each pull request, on GitHub's
# hosted runners (free for public repositories). See docs/app-builds.md for
# where the builds go and how to install them.
name: Builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A new push to a pull request replaces the run in progress; runs on main
# finish in order.
concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Each job's timeout-minutes is a few times its usual run, so a stuck step
# fails in minutes instead of after GitHub's default of 6 hours. The macOS
# limits also leave time to download a missing watchOS or iOS platform.
jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The build number counts every commit, so it needs the full history
          fetch-depth: 0
      # VERSION holds major.minor, and the commit count is the patch number
      # and the build number, so every build has its own increasing version.
      # A version tag names the version instead: v1.2.0 builds 1.2.0. The
      # build number is still the commit count, so it keeps rising.
      - id: version
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          if [[ ! $base =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::VERSION must be major.minor, such as 1.0, not '$base'"
            exit 1
          fi
          build=$(git rev-list --count HEAD)
          version=$base.$build
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            if [[ ! $GITHUB_REF_NAME =~ ^v(([0-9]+\.[0-9]+)\.[0-9]+)$ ]]; then
              echo "::error::Version tags look like v1.2.0, not '$GITHUB_REF_NAME'"
              exit 1
            fi
            version=${BASH_REMATCH[1]}
            tagged=${BASH_REMATCH[2]}
            newer=$(printf '%s\n' "$base" "$tagged" | sort -V | tail -n 1)
            if [[ $tagged != "$base" && $newer == "$tagged" ]]; then
              echo "::warning file=VERSION::VERSION is $base, so builds of main after $GITHUB_REF_NAME will be numbered $base.<build>, below $version. Set VERSION to $tagged."
            fi
          fi
          {
            echo "version=$version"
            echo "build=$build"
            echo "commit=${COMMIT::7}"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version (build $build) from ${COMMIT::7}"

  server:
    name: Server
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    env:
      ARCHIVE: StepWrite-server-${{ needs.version.outputs.version }}.zip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Test the server
        working-directory: server
        run: |
          npm ci
          npm test
      # The server's files with its dependencies installed, so the folder runs
      # as it is. Left out: the tests, the Netlify function (docs/deploy-netlify.md),
      # and user_memories.json, which holds the developer's own details for the
      # (off by default) memory feature.
      - name: Package the server
        run: |
          git archive HEAD -- server ':!server/test' ':!server/netlify' ':!server/data/user_memories.json' | tar -x
          mv server StepWrite-server
          npm ci --omit=dev --no-audit --no-fund --prefix StepWrite-server
          zip -qry "$ARCHIVE" StepWrite-server
      # Starts the server from the zip with a placeholder OpenAI key, which is
      # enough to start, and sends it a request without text. Its own 400
      # answer shows that it runs and serves the API; nothing reaches OpenAI.
      - name: Check that the packaged server starts
        run: |
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/unzipped"
          cd "$RUNNER_TEMP/unzipped/StepWrite-server"
          OPENAI_API_KEY=placeholder node server.js > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          status=000
          for _ in {1..30}; do
            status=$(curl -s -o "$RUNNER_TEMP/response.json" -w '%{http_code}' \
              -H 'Content-Type: application/json' -d '{}' \
              http://localhost:3001/api/tts/generate) && break
            kill -0 "$server" 2> /dev/null || break  # it stopped
            sleep 1
          done
          kill "$server" || true
          cat "$RUNNER_TEMP/server.log"
          if [[ $status != 400 ]]; then
            echo "::error::The packaged server didn't answer as expected (HTTP $status)"
            exit 1
          fi
          echo "The packaged server answered: $(cat "$RUNNER_TEMP/response.json")"
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ARCHIVE }}
          archive: false

  web:
    name: Web client
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    env:
      ARCHIVE: StepWrite-web-${{ needs.version.outputs.version }}.zip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      # With CI set, as it is on GitHub, the client tests run once. Lint
      # warnings fail the build.
      - name: Test and lint the client
        working-directory: client
        run: |
          npm ci
          npm test
          npm run lint
      - name: Build the client
        working-directory: client
        run: npm run build
      # In a StepWrite-web folder, so unzipping doesn't scatter the files
      - name: Package the client
        run: |
          mv client/build StepWrite-web
          zip -qr "$ARCHIVE" StepWrite-web
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ARCHIVE }}
          archive: false

  watch:
    name: Apple Watch app
    needs: version
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
      ARCHIVE: StepWrite-watch-simulator-${{ needs.version.outputs.version }}.zip
    steps:
      - uses: actions/checkout@v7
      - name: Install the watchOS platform if it is missing
        run: |
          xcodebuild -version
          if ! xcrun simctl list runtimes | grep -q '^watchOS'; then
            xcodebuild -downloadPlatform watchOS
          fi
      # On the Mac itself, since the code they test is plain Swift (see
      # watch/Tests/README.md)
      - name: Test the voice commands
        run: swift test --package-path watch/Tests
      # Unsigned: installing on a watch needs the developer's own Apple ID in
      # Xcode, which a shared runner doesn't have. The device build checks that
      # the app compiles for a real watch; the simulator build is the download.
      - name: Build for Apple Watch and the watchOS simulator
        run: |
          args=(
            -project watch/StepWrite.xcodeproj -scheme StepWrite
            -configuration Release -derivedDataPath build/watch -quiet
            CODE_SIGNING_ALLOWED=NO
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD"
          )
          xcodebuild build "${args[@]}" -destination generic/platform=watchOS
          xcodebuild build "${args[@]}" -destination 'generic/platform=watchOS Simulator'
      # Without extended attributes, which would unzip as stray ._ files
      # anywhere but in Finder
      - name: Package the simulator app
        run: >-
          ditto -c -k --keepParent --norsrc --noextattr
          build/watch/Build/Products/Release-watchsimulator/StepWrite.app "$ARCHIVE"
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ARCHIVE }}
          archive: false

  android:
    name: Android app
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
      APK: StepWrite-android-${{ needs.version.outputs.version }}.apk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            mobile/package-lock.json
      # Capacitor 8's Android library is compiled for Java 21
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # The repository variable STEPWRITE_SERVER_URL, when set, is the server
      # the app calls. Otherwise it uses the web client's address.
      - name: Build the web client into the app
        env:
          SERVER_URL: ${{ vars.STEPWRITE_SERVER_URL }}
        run: |
          npm ci --prefix client
          npm ci --prefix mobile
          npm run build --prefix mobile
      # Signed with the key in the repository's secrets, when there is one,
      # so each new APK installs over the last. Without it, a key made for
      # this run signs the APK: it still installs, but over no earlier build.
      - name: Get a signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/release.jks"
          if [[ -n $KEYSTORE_BASE64 ]]; then
            base64 --decode <<< "$KEYSTORE_BASE64" > "$keystore"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so this APK is signed with a one-off key and won't install over earlier builds. See docs/app-builds.md."
            KEYSTORE_PASSWORD=$(openssl rand -hex 16)
            echo "::add-mask::$KEYSTORE_PASSWORD"
            KEY_ALIAS=stepwrite
            KEY_PASSWORD=$KEYSTORE_PASSWORD
            keytool -genkeypair -keystore "$keystore" -storetype PKCS12 \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname 'CN=StepWrite one-off build key'
          fi
          {
            echo "SIGNING_STORE_FILE=$keystore"
            echo "SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      # The android.injected.signing properties are the ones Android Studio
      # passes when it builds a signed APK, so build.gradle needs no keys.
      - name: Build the APK
        working-directory: mobile/android
        run: >-
          ./gradlew assembleRelease --no-daemon
          -PversionCode="$BUILD" -PversionName="$VERSION"
          -Pandroid.injected.signing.store.file="$SIGNING_STORE_FILE"
          -Pandroid.injected.signing.store.password="$SIGNING_STORE_PASSWORD"
          -Pandroid.injected.signing.key.alias="$SIGNING_KEY_ALIAS"
          -Pandroid.injected.signing.key.password="$SIGNING_KEY_PASSWORD"
      - name: Name the APK
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk "$APK"
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.APK }}
          archive: false

  iphone:
    name: iPhone app
    needs: version
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      ipa-url: ${{ steps.upload-ipa.outputs.artifact-url }}
      simulator-url: ${{ steps.upload-simulator.outputs.artifact-url }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
      IPA: StepWrite-iphone-${{ needs.version.outputs.version }}-unsigned.ipa
      ARCHIVE: StepWrite-iphone-simulator-${{ needs.version.outputs.version }}.zip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            mobile/package-lock.json
      - name: Build the web client into the app
        env:
          SERVER_URL: ${{ vars.STEPWRITE_SERVER_URL }}
        run: |
          npm ci --prefix client
          npm ci --prefix mobile
          npm run build --prefix mobile
      - name: Install the iOS platform if it is missing
        run: |
          xcodebuild -version
          if ! xcrun simctl list runtimes | grep -q '^iOS'; then
            xcodebuild -downloadPlatform iOS
          fi
      # Unsigned, like the watch app: AltStore, SideStore or Xcode signs it
      # with the installer's own Apple ID.
      - name: Build for iPhone and the iOS simulator
        run: |
          args=(
            -project mobile/ios/App/App.xcodeproj -scheme App
            -configuration Release -derivedDataPath build/iphone -quiet
            CODE_SIGNING_ALLOWED=NO
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD"
          )
          xcodebuild build "${args[@]}" -destination generic/platform=iOS
          xcodebuild build "${args[@]}" -destination 'generic/platform=iOS Simulator'
      # An IPA is a zip with the app in a Payload folder
      - name: Package the apps
        run: |
          products=build/iphone/Build/Products
          mkdir -p ipa/Payload
          cp -R "$products/Release-iphoneos/App.app" ipa/Payload/
          (cd ipa && zip -qry "../$IPA" Payload)
          ditto -c -k --keepParent --norsrc --noextattr \
            "$products/Release-iphonesimulator/App.app" "$ARCHIVE"
      - id: upload-ipa
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.IPA }}
          archive: false
      - id: upload-simulator
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ARCHIVE }}
          archive: false

  # The StepWrite Voice keyboard proof of concept (keyboard/README.md): the app
  # with its keyboard and share extensions
  keyboard:
    name: iPhone keyboard
    needs: version
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
      ARCHIVE: StepWrite-keyboard-simulator-${{ needs.version.outputs.version }}.zip
    steps:
      - uses: actions/checkout@v7
      - name: Install the iOS platform if it is missing
        run: |
          xcodebuild -version
          if ! xcrun simctl list runtimes | grep -q '^iOS'; then
            xcodebuild -downloadPlatform iOS
          fi
      # Unsigned, like the watch app: installing on a phone needs the
      # developer's own Apple ID in Xcode. The device build checks that it
      # compiles for a real iPhone; the simulator build is the download.
      - name: Build for iPhone and the iOS simulator
        run: |
          args=(
            -project keyboard/StepWriteKeyboard.xcodeproj -scheme StepWriteKeyboard
            -configuration Release -derivedDataPath build/keyboard -quiet
            CODE_SIGNING_ALLOWED=NO
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD"
          )
          xcodebuild build "${args[@]}" -destination generic/platform=iOS
          xcodebuild build "${args[@]}" -destination 'generic/platform=iOS Simulator'
      - name: Package the simulator app
        run: >-
          ditto -c -k --keepParent --norsrc --noextattr
          build/keyboard/Build/Products/Release-iphonesimulator/StepWriteKeyboard.app "$ARCHIVE"
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ARCHIVE }}
          archive: false

  # Writes each app's version and build result to the run summary and, on a
  # pull request, to one comment that every run updates. Pull requests from
  # forks get only the summary, since their token can't comment.
  report:
    name: Report
    needs: [version, server, web, watch, android, iphone]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DOCS_URL: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/app-builds.md
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      VERSION: ${{ needs.version.outputs.version || 'unknown' }}
      COMMIT: ${{ needs.version.outputs.commit || 'unknown' }}
      SERVER_RESULT: ${{ needs.server.result }}
      SERVER_URL: ${{ needs.server.outputs.artifact-url }}
      WEB_RESULT: ${{ needs.web.result }}
      WEB_URL: ${{ needs.web.outputs.artifact-url }}
      ANDROID_RESULT: ${{ needs.android.result }}
      ANDROID_URL: ${{ needs.android.outputs.artifact-url }}
      IPHONE_RESULT: ${{ needs.iphone.result }}
      IPHONE_URL: ${{ needs.iphone.outputs.ipa-url }}
      IPHONE_SIMULATOR_URL: ${{ needs.iphone.outputs.simulator-url }}
      WATCH_RESULT: ${{ needs.watch.result }}
      WATCH_URL: ${{ needs.watch.outputs.artifact-url }}
    steps:
      - name: Write the report
        run: |
          row() {  # app, job result, download URL
            local status link=''
            case $2 in
              success) status='✅ Built'; [[ -n $3 ]] && link="[Download]($3)" ;;
              failure) status='❌ Failed' ;;
              cancelled) status='⏹️ Cancelled' ;;
              *) status='⏭️ Skipped' ;;
            esac
            echo "| $1 | $VERSION | $status | $link |"
          }
          {
            echo '<!-- stepwrite-builds -->'
            echo '### StepWrite builds'
            echo
            echo "Version **$VERSION**, built from \`$COMMIT\` ([run]($RUN_URL))."
            echo
            echo '| App | Version | Build | Download |'
            echo '| --- | --- | --- | --- |'
            row 'Server' "$SERVER_RESULT" "$SERVER_URL"
            row 'Web client' "$WEB_RESULT" "$WEB_URL"
            row 'Android (APK)' "$ANDROID_RESULT" "$ANDROID_URL"
            row 'iPhone (unsigned IPA)' "$IPHONE_RESULT" "$IPHONE_URL"
            row 'iPhone (simulator)' "$IPHONE_RESULT" "$IPHONE_SIMULATOR_URL"
            row 'Apple Watch (simulator)' "$WATCH_RESULT" "$WATCH_URL"
            echo
            echo "Downloads need a GitHub sign-in. To install them, see [App builds]($DOCS_URL)."
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api --paginate "repos/$GH_REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- stepwrite-builds -->"))) | .id' \
            | head -n 1)
          if [[ -n $id ]]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@report.md > /dev/null
          else
            gh api "repos/$GH_REPO/issues/$PR/comments" -F body=@report.md > /dev/null
          fi

  # Publishes the builds, only when every one of them succeeded:
  # - Each push to main replaces the files of the "latest" prerelease, so
  #   releases/download/latest/StepWrite-android.apk, for example, is always
  #   the newest build of main.
  # - Each version tag gets a release of its own, which GitHub marks as the
  #   latest release, so releases/latest/download/StepWrite-android.apk is
  #   always the newest version.
  # The file names never change, so those links keep working.
  release:
    name: Release
    needs: [version, server, web, watch, android, iphone]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DOCS_URL: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/app-builds.md
      VERSION: ${{ needs.version.outputs.version }}
      COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      # Every build is uploaded as its own file (archive: false). Without
      # skip-decompress, the .zip builds would be unpacked here instead of
      # kept as the files to release.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
          skip-decompress: true
      - name: Name the files
        run: |
          mkdir dist
          take() {  # built file, release file name
            local file
            file=$(find artifacts -type f -name "$1" | head -n 1)
            if [[ -z $file ]]; then
              echo "::error::No build named $1"
              exit 1
            fi
            cp "$file" "dist/$2"
          }
          take "StepWrite-server-$VERSION.zip" StepWrite-server.zip
          take "StepWrite-web-$VERSION.zip" StepWrite-web.zip
          take "StepWrite-android-$VERSION.apk" StepWrite-android.apk
          take "StepWrite-iphone-$VERSION-unsigned.ipa" StepWrite-iphone-unsigned.ipa
          take "StepWrite-iphone-simulator-$VERSION.zip" StepWrite-iphone-simulator.zip
          take "StepWrite-watch-simulator-$VERSION.zip" StepWrite-watch-simulator.zip
          ls -l dist
      - name: Write the release notes
        run: |
          releases="$GITHUB_SERVER_URL/$GH_REPO/releases"
          commit="[\`$COMMIT\`]($GITHUB_SERVER_URL/$GH_REPO/commit/$GITHUB_SHA)"
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            download="$releases/download/$GITHUB_REF_NAME"
            intro="StepWrite **$VERSION**, built from $commit."
          else
            download="$releases/download/latest"
            intro="The newest build of main: StepWrite **$VERSION**, built from $commit. For the newest version, see the [latest release]($releases/latest)."
          fi
          {
            echo "$intro"
            echo
            echo '| App | Version | Download |'
            echo '| --- | --- | --- |'
            echo "| Server | $VERSION | [StepWrite-server.zip]($download/StepWrite-server.zip) |"
            echo "| Web client | $VERSION | [StepWrite-web.zip]($download/StepWrite-web.zip) |"
            echo "| Android | $VERSION | [StepWrite-android.apk]($download/StepWrite-android.apk) |"
            echo "| iPhone | $VERSION | [StepWrite-iphone-unsigned.ipa]($download/StepWrite-iphone-unsigned.ipa) |"
            echo "| iPhone (simulator) | $VERSION | [StepWrite-iphone-simulator.zip]($download/StepWrite-iphone-simulator.zip) |"
            echo "| Apple Watch (simulator) | $VERSION | [StepWrite-watch-simulator.zip]($download/StepWrite-watch-simulator.zip) |"
            echo
            echo "Every app installs for free. See [App builds]($DOCS_URL)."
          } > notes.md
      # Moving the tag keeps the release, so watchers aren't notified on every
      # push. If GitHub refuses the move (the workflow token may not move a tag
      # across changes to workflow files), the release is made again instead.
      # It stays a prerelease, so it never replaces a version as the latest.
      - name: Publish the newest build of main
        if: github.ref == 'refs/heads/main'
        run: |
          title="StepWrite $VERSION (newest build of main)"
          if gh release view latest > /dev/null 2>&1 &&
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true > /dev/null; then
            gh release edit latest --title "$title" --notes-file notes.md \
              --prerelease --latest=false
            gh release upload latest dist/* --clobber
          else
            gh release delete latest --cleanup-tag --yes 2> /dev/null || true
            gh api --method DELETE "repos/$GH_REPO/git/refs/tags/latest" 2> /dev/null || true
            gh release create latest dist/* --target "$GITHUB_SHA" \
              --title "$title" --notes-file notes.md --prerelease --latest=false
          fi
      # The notes list the builds, then GitHub's list of the changes since the
      # previous version. A release someone already made for the tag keeps its
      # title and notes and gets the files.
      - name: Publish the version
        if: github.ref_type == 'tag'
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
              --title "StepWrite $VERSION" --notes-file notes.md --generate-notes --latest
          fi
